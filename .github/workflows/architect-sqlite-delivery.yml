name: architect-sqlite-delivery

# One-use transport for already-scanned source; never runs on main or PR #83.
on:
  push:
    branches: [architect/83-sqlite-reuse-20261113]
    paths: [.github/workflows/architect-sqlite-delivery.yml]
permissions:
  contents: write
concurrency:
  group: architect-sqlite-delivery
  cancel-in-progress: false
jobs:
  deliver:
    if: github.repository == 'youling/ghostfleet' && github.ref == 'refs/heads/architect/83-sqlite-reuse-20261113'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Apply exact checked source delta
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess
          base = 'a85d6c292aff5feb92c492023c063c07597de02d'
          assert subprocess.check_output(['git','rev-parse','HEAD^'], text=True).strip() == base
          blob = json.loads(subprocess.check_output(['gh','api','repos/youling/ghostfleet/git/blobs/c7ed18f8354c42ab43149596f35283f44891e03e'], text=True))
          packed = base64.b64decode(blob['content'])
          assert hashlib.sha256(packed).hexdigest() == '9f4b1373058aee12242d36fd4512d15ee6985c6407636889a239066bb8385c8d'
          decoder = lzma.LZMADecompressor(memlimit=128*1024*1024)
          raw = decoder.decompress(packed, max_length=2*1024*1024)
          assert decoder.eof and not decoder.unused_data
          transfer = json.loads(raw)
          assert transfer['base'] == base and len(transfer['files']) == 23
          allowed = {
              'docs/architecture/NODE_AGENT_SQLITE.md',
              'docs/architecture/NODE_AGENT_SQLITE_EVIDENCE.json',
              'docs/architecture/NODE_AGENT_SQLITE_TEST_MIGRATION.json',
              'docs/architecture/NODE_AGENT_V0.md',
              'packages/node-agent/README.md',
              'packages/node-agent/src/ghostfleet_agent/cli.py',
              'packages/node-agent/src/ghostfleet_agent/client.py',
              'packages/node-agent/src/ghostfleet_agent/delivery.py',
              'packages/node-agent/src/ghostfleet_agent/ledger.py',
              'packages/node-agent/src/ghostfleet_agent/loop.py',
              'packages/node-agent/src/ghostfleet_agent/outbox.py',
              'packages/node-agent/src/ghostfleet_agent/repository.py',
              'packages/node-agent/src/ghostfleet_agent/sqlite_loop.py',
              'packages/node-agent/tests/test_ledger.py',
              'packages/node-agent/tests/test_loop_fake_control_plane.py',
              'packages/node-agent/tests/test_outbox.py',
              'packages/node-agent/tests/test_repository.py',
              'packages/node-agent/tests/test_repository_runtime_gate.py',
              'packages/node-agent/tests/test_sqlite_loop.py',
              'packages/node-agent/tests/test_zipapp.py',
              'packages/node-agent/tools/probe_sqlite_systemd.py',
              'publication-policy.json',
              'scripts/test-node-agent-lifecycle-disposable-linux.sh',
          }
          assert {f['path'] for f in transfer['files']} == allowed
          for item in transfer['files']:
              path = pathlib.Path(item['path'])
              assert not path.is_symlink()
              old = path.read_bytes() if path.exists() else None
              assert (hashlib.sha256(old).hexdigest() if old is not None else None) == item['before_sha256'], str(path)
              if 'edits' in item:
                  lines = old.decode('utf-8').splitlines(keepends=True)
                  end = len(lines)
                  for lo, hi, text in reversed(item['edits']):
                      assert 0 <= lo <= hi <= end
                      lines[lo:hi] = [text]
                      end = lo
                  data = ''.join(lines).encode('utf-8')
              else:
                  data = None if item['content'] is None else item['content'].encode('utf-8')
              assert (hashlib.sha256(data).hexdigest() if data is not None else None) == item['after_sha256'], str(path)
              if data is None:
                  path.unlink()
              else:
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(data)
          pathlib.Path(os.environ['RUNNER_TEMP'], 'sqlite-transfer.json').write_bytes(raw)
          print('SOURCE_DELTA_VERIFIED files=23 base=' + base)
          PY
      - name: Rebuild and verify the already-tested artifact
        run: |
          python packages/node-agent/tools/build_pyz.py --out packages/node-agent/dist/node-agent.pyz
          python - <<'PY'
          import hashlib, pathlib
          data=pathlib.Path('packages/node-agent/dist/node-agent.pyz').read_bytes()
          assert len(data)==216146
          assert hashlib.sha256(data).hexdigest()=='3ee59187c94c20072e59335017fd8df0ce0cb610c1502af69915fca5be9ca036'
          print('EXACT_TESTED_PYZ_VERIFIED')
          PY
          node scripts/verify-node-agent-pyz.mjs
      - name: Re-run candidate checks without production privileges
        run: |
          python -m pip install pytest==8.4.2
          python -m pytest packages/node-agent -q
          node scripts/publication-guard.mjs
          node scripts/docs-check.mjs
      - name: Publish only to the guarded contribution branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch=architect/83-sqlite-reuse-20261113
          gh auth setup-git
          actual=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$actual" = "$GITHUB_SHA"
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          t=json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'sqlite-transfer.json').read_text())
          paths=[]
          for f in t['files']:
              p=pathlib.Path(f['path']);data=p.read_bytes() if p.exists() else None
              assert (hashlib.sha256(data).hexdigest() if data is not None else None)==f['after_sha256'], str(p)
              paths.append(str(p))
          subprocess.run(['git','add','-A','--',*paths],check=True)
          subprocess.run(['git','add','-f','--','packages/node-agent/dist/node-agent.pyz'],check=True)
          PY
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'refactor(node-agent): deliver verified SQLite task repository and tests'
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD

name: transport-config
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  transport-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install OpenSSH and systemd validators
        run: |
          sudo apt-get update
          sudo apt-get install --yes openssh-server systemd
      - name: Validate SSH client aliases
        run: |
          ssh -G -F config/ssh/ghostfleet.conf.example node-cf >/dev/null
          ssh -G -F config/ssh/ghostfleet.conf.example node-ts >/dev/null
      - name: Validate sshd syntax, effective authentication and root admission
        run: |
          sudo install -d -m 0755 /run/sshd
          sudo env SSHD_BIN=/usr/sbin/sshd sh test/verify-sshd-admin.test.sh
      - name: Validate cloudflared systemd unit syntax
        run: |
          if [ ! -x /usr/bin/cloudflared ]; then sudo install -m 0755 /bin/true /usr/bin/cloudflared; fi
          sudo groupadd --system --force cloudflared
          sudo useradd --system --gid cloudflared --home-dir /nonexistent --no-create-home --shell /usr/sbin/nologin cloudflared 2>/dev/null || true
          cp config/systemd/cloudflared-ssh.service.example /tmp/cloudflared-ssh.service
          systemd-analyze verify /tmp/cloudflared-ssh.service
      - name: Run publication boundary guard
        run: node scripts/publication-guard.mjs
      - name: Test publication boundary guard
        run: node --test test/publication-guard.test.mjs

name: transport-config

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ssh-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Cloudflare SSH client config
        run: ssh -G -F config/ssh/ghostfleet.conf.example omv8-cf >/dev/null
      - name: Validate Tailscale SSH client config
        run: ssh -G -F config/ssh/ghostfleet.conf.example omv8-ts >/dev/null
      - name: Ensure examples contain no command filter
        run: |
          if grep -R -nE '^[[:space:]]*(ForceCommand|PermitOpen|command=)' config/; then
            echo "Command filtering is outside the GhostFleet transport contract."
            exit 1
          fi

name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python -m pip install -e "packages/runtime-python[test]"
      - run: python scripts/verify-python-artifact.py
      # The Console launcher must hand the Human identity into the elevated
      # bootstrap; the suite needs a real /run workspace, so it runs as root.
      - if: runner.os == 'Linux'
        run: sudo -n env "PATH=$PATH" node --test test/enrollment-launcher-composition.test.js
      - run: npm run test:all
      - run: npm run check:all
      # The node agent zipapp is a pinned release artifact: rebuild it from the
      # committed build entry and require byte equality, then smoke the entry
      # point. These two checks ship with the node agent implementation, so a
      # branch without it fails here instead of silently skipping the pin.
      - if: runner.os == 'Linux'
        name: Verify the deterministic node agent payload
        run: |
          if [ ! -f scripts/verify-node-agent-pyz.mjs ]; then
            echo "::error::MISSING_VERIFY_SCRIPT: scripts/verify-node-agent-pyz.mjs ships with the node agent implementation"
            exit 1
          fi
          npm run --silent verify:node-agent-pyz
      # The systemd user unit is the second pinned artifact. Verify that it
      # parses and print its digest so the log pins the exact bytes.
      - if: runner.os == 'Linux'
        name: Verify the pinned systemd user unit
        run: |
          unit=packages/bootstrap/assets/ghostfleet-managed.service
          if [ ! -f "$unit" ]; then
            echo "::error::MISSING_UNIT_ASSET: $unit ships with the courier install line"
            exit 1
          fi
          sha256sum "$unit"
          systemd-analyze verify "$unit"
      - run: npm run check:publication
      - run: npm run check:docs
      - run: npm run build:console
      - run: npm run build:typed
      - run: node examples/typed-control-synthetic.mjs
      - run: npm run build:worker
        env:
          WRANGLER_SEND_METRICS: "false"
      - run: node scripts/build-assets.mjs --inventory test/fixtures/assets/sample-assets.json --out dist/assets
      - run: npm run build:assets-worker
        env:
          WRANGLER_SEND_METRICS: "false"
      - run: npm run build:enroll-worker
        env:
          WRANGLER_SEND_METRICS: "false"
      - run: npm run verify:cloud
        if: runner.os == 'Linux'
      - run: npm run verify:ai-client-neutral

  privileged-disposable:
    # This job changes a one-use GitHub-hosted VM only. Fork PRs do not run
    # contributor-provided root-level helper code.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Actual helper setup on disposable Ubuntu VM (not NAS)
        shell: bash
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo -n env GITHUB_ACTIONS="$GITHUB_ACTIONS" \
            RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            GHOSTFLEET_DISPOSABLE_TEST_CONFIRMED=1 \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            GHOSTFLEET_TEST_ORDINARY_USER="$(id -un)" \
            bash scripts/test-privileged-disposable-linux.sh

  bootstrap-capability-disposable:
    # Proves the PUBLISHED bootstrap courier installs the template-selected
    # privileged capability under real root on a one-use VM. Fork PRs do not run
    # contributor-provided root-level code.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Published bootstrap installs the selected capability as root
        shell: bash
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo -n env GITHUB_ACTIONS="$GITHUB_ACTIONS" \
            RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            GHOSTFLEET_DISPOSABLE_TEST_CONFIRMED=1 \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            GHOSTFLEET_TEST_ORDINARY_USER="$(id -un)" \
            PATH="$PATH" \
            bash scripts/test-bootstrap-capability-disposable-linux.sh

  chain-acceptance-disposable:
    # Joins the two halves in one run: the Console launcher text, a real
    # non-root Human behind real sudo and env -i, the published courier, the
    # claim, the reviewed installer, the user unit and Linger, then a zero-delta
    # second run. Fork PRs do not run contributor-provided root-level code.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Chained acceptance (launcher, sudo, courier, claim, installer)
        shell: bash
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo -n env GITHUB_ACTIONS="$GITHUB_ACTIONS" \
            RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            GHOSTFLEET_DISPOSABLE_TEST_CONFIRMED=1 \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            PATH="$PATH" \
            bash scripts/test-chain-acceptance-disposable-linux.sh

  node-agent-disposable:
    # Proves the node agent artifact the courier ships: deterministic zipapp,
    # pinned systemd user unit, a real non-root control account behind Linger,
    # boot/session recovery, failure recovery, crash-fence UNKNOWN, task safety
    # and a read-only consumer, all against the repository's own control plane
    # modules over loopback HTTPS. Fork PRs do not run contributor-provided
    # root-level code.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # 240s offline stability window plus four heartbeat cycles, a boot/session
    # recovery, a crash/reconcile arm and the consumer arm.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # Ubuntu 24.04 restricts unprivileged user namespaces by default
      # (kernel.apparmor_restrict_unprivileged_userns=1). A user unit then cannot
      # set up the namespaces the hardened service asks for: systemd logs
      # "UTS namespace setup is prohibited (container manager?)" and every
      # Protect*/ReadWritePaths directive silently degrades to a no-op, so the
      # harness could never prove the sandbox it exists to prove. Node
      # administrators lift the same switch on such hosts; lifting it here keeps
      # the harness bytes identical to the ones that produced the acceptance
      # evidence instead of weakening an assertion.
      - name: Permit unprivileged user namespaces
        shell: bash
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns >/dev/null
          fi
          if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then
            echo 1 | sudo tee /proc/sys/kernel/unprivileged_userns_clone >/dev/null
          fi
          sysctl kernel.apparmor_restrict_unprivileged_userns kernel.unprivileged_userns_clone 2>/dev/null || true

      # The order matters (m01969): the deterministic payload and the pinned unit
      # are verified before the lifecycle harness installs them, so a bad artifact
      # fails fast with its own name instead of as an obscure lifecycle failure.
      - name: Verify the deterministic node agent payload
        shell: bash
        run: |
          if [ ! -f scripts/verify-node-agent-pyz.mjs ]; then
            echo "::error::MISSING_VERIFY_SCRIPT: scripts/verify-node-agent-pyz.mjs ships with the node agent implementation (na-core tools/build_pyz.py + the committed dist artifact)."
            exit 1
          fi
          npm run --silent verify:node-agent-pyz

      - name: Verify the pinned systemd user unit
        shell: bash
        run: |
          if [ ! -f packages/bootstrap/assets/ghostfleet-managed.service ]; then
            echo "::error::MISSING_UNIT_ASSET: packages/bootstrap/assets/ghostfleet-managed.service ships with the courier install line."
            exit 1
          fi
          sha256sum packages/bootstrap/assets/ghostfleet-managed.service
          systemd-analyze verify packages/bootstrap/assets/ghostfleet-managed.service

      - name: Node agent lifecycle acceptance (artifact, linger, recovery, tasks)
        shell: bash
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo -n env GITHUB_ACTIONS="$GITHUB_ACTIONS" \
            RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            GHOSTFLEET_DISPOSABLE_TEST_CONFIRMED=1 \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            PATH="$PATH" \
            bash scripts/test-node-agent-lifecycle-disposable-linux.sh

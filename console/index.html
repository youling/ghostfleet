<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GhostFleet · 控制面板</title>
  <script src="./appearance.js"></script>
  <link rel="stylesheet" href="./assets/tabler.min.css">
  <link rel="stylesheet" href="./console.css">
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="skip">跳到主要内容</a>
  <aside class="desktop-sidebar sidebar" id="sidebar">
    <a class="brand" href="#overview"><span data-icon="ghost"></span><span class="brand-copy">GhostFleet<span class="brand-subtitle">Control plane</span></span><span class="version">V0</span></a>
    <nav data-console-navigation class="module-navigation"></nav>
    <div class="sidebar-footer"><div class="sidebar-session"></div><a href="https://github.com/youling/ghostfleet" target="_blank" rel="noopener noreferrer" class="source-link"><span data-icon="external"></span><span class="nav-label" data-i18n="source">源代码</span></a></div>
  </aside>
  <div class="app-content">
    <header class="topbar">
      <button id="navigation-toggle" class="btn icon-button" type="button" data-i18n-aria="toggleNavigation" aria-controls="sidebar"><span data-icon="menu"></span></button>
      <div class="breadcrumb"><span data-i18n="workspace">工作空间</span><span class="breadcrumb-separator">/</span><span id="breadcrumb-current"></span></div>
      <div class="topbar-tools">
        <button id="open-search" type="button" class="command-trigger" data-i18n-aria="searchTitle"><span data-icon="search"></span><span data-i18n="quickSearch">搜索…</span><kbd>Ctrl K</kbd></button>
        <button id="theme-toggle" class="btn icon-button" type="button" data-i18n-aria="toggleTheme"></button>
        <label for="language" class="visually-hidden" data-i18n="language">界面语言</label>
        <select id="language" class="form-select language-select"><option value="zh-CN">中文</option><option value="en">English</option></select>
        <button id="session-link" class="session-button" type="button"><span class="session-dot" aria-hidden="true"></span><span id="connection-status"></span></button>
      </div>
    </header>
    <main id="main" tabindex="-1">
      <div class="page-heading">
        <div><h1 id="page-title" tabindex="-1"></h1><p id="page-description"></p></div>
        <div class="page-actions">
          <button id="refresh" class="btn btn-outline-secondary" type="button" disabled><span data-icon="refresh"></span><span id="refresh-label" data-i18n="refresh">刷新状态</span></button>
          <button id="open-create" class="btn btn-primary" type="button" disabled><span data-icon="plus"></span><span data-i18n="createRecord">创建纳管记录</span></button>
        </div>
      </div>
      <div id="feedback" class="feedback" role="status" aria-live="polite" aria-atomic="true" hidden></div>
      <div id="permission-banner" class="permission-banner" hidden></div>
      <div id="page-content"></div>
      <section id="settings-view" hidden aria-labelledby="settings-connection-title">
        <div class="settings-section">
          <div class="settings-description"><h2 id="settings-connection-title" data-i18n="connection">连接控制平面</h2><p class="secondary" data-i18n="connectionSettingsHelp">使用此实例的访问令牌连接。令牌仅保留在当前页面内存中。</p></div>
          <form id="connect" class="settings-form">
            <label for="api-token" class="form-label" data-i18n="tokenLabel">访问令牌</label>
            <input id="api-token" name="api_token" class="form-control" type="password" autocomplete="off" spellcheck="false" required aria-describedby="token-help" data-i18n-placeholder="tokenPlaceholder">
            <p id="token-help" class="secondary help" data-i18n="tokenHelp"></p>
            <div class="record-actions"><button class="btn btn-primary" type="submit" id="connect-button" data-i18n="connect">连接</button><button id="disconnect" class="btn btn-outline-secondary" type="button" disabled data-i18n="disconnect">断开</button></div>
            <p id="connection-access" class="secondary help"></p>
          </form>
        </div>
        <div class="settings-section">
          <div class="settings-description"><h2 data-i18n="appearance">外观</h2><p class="secondary" data-i18n="appearanceHelp">匹配当前使用环境，外观偏好仅保存在本浏览器。</p></div>
          <div class="settings-form"><label for="theme-preference" class="form-label" data-i18n="theme">主题</label><select id="theme-preference" class="form-select"><option value="system" data-i18n="systemTheme">跟随系统</option><option value="light" data-i18n="lightTheme">浅色</option><option value="dark" data-i18n="darkTheme">深色</option></select></div>
        </div>
        <div class="settings-section">
          <div class="settings-description"><h2 data-i18n="currentScope">当前能力范围</h2></div>
          <div class="settings-form"><p class="secondary" data-i18n="recordScope"></p><a class="text-link" href="https://github.com/youling/ghostfleet/blob/main/README.md" target="_blank" rel="noopener noreferrer" data-i18n="source">源代码</a></div>
        </div>
      </section>
      <footer class="console-footer"><span data-i18n="footer"></span><span id="last-read"></span></footer>
    </main>
  </div>

  <dialog id="navigation-dialog" class="navigation-dialog" data-i18n-aria="navigation" aria-label="导航">
    <div class="mobile-sidebar sidebar">
      <div class="mobile-brand"><a class="brand" href="#overview"><span data-icon="ghost"></span><span class="brand-copy">GhostFleet<span class="brand-subtitle">Control plane</span></span></a><button type="button" class="btn icon-button" data-close-dialog="navigation-dialog" data-i18n-aria="close"><span data-icon="close"></span></button></div>
      <nav data-console-navigation class="module-navigation"></nav>
      <div class="sidebar-footer"><div class="sidebar-session"></div></div>
    </div>
  </dialog>
  <dialog id="search-dialog" class="search-dialog" aria-labelledby="search-title">
    <div class="search-heading"><h2 id="search-title" data-i18n="searchTitle">搜索页面与记录</h2><button type="button" class="btn icon-button" data-close-dialog="search-dialog" data-i18n-aria="close"><span data-icon="close"></span></button></div>
    <div class="command-input"><span data-icon="search"></span><label for="command-query" class="visually-hidden" data-i18n="searchTitle"></label><input id="command-query" class="form-control" type="search" autocomplete="off" data-i18n-placeholder="commandPlaceholder" placeholder="输入设备名称、记录 ID 或页面名称"></div>
    <div id="command-results"></div><p class="command-help" data-i18n="commandHelp">方向键选择，Enter 打开，Esc 关闭</p>
  </dialog>
  <dialog id="create-dialog" class="create-dialog" aria-labelledby="create-title">
    <div class="dialog-heading"><h2 id="create-title" data-i18n="createRecord">创建纳管记录</h2><button type="button" class="btn icon-button" data-close-dialog="create-dialog" data-i18n-aria="close"><span data-icon="close"></span></button></div>
    <form id="new-attempt">
      <div id="create-feedback" class="feedback" role="status" aria-live="polite" aria-atomic="true" hidden></div>
      <div id="create-recovery" class="dialog-recovery" hidden><button type="button" class="btn btn-outline-secondary" data-refresh-state data-i18n="readServerState">读取服务端状态</button></div>
      <label for="asset-hint" class="form-label" data-i18n="deviceLabel">设备名称</label>
      <input id="asset-hint" name="asset_hint" class="form-control" required maxlength="120" data-i18n-placeholder="devicePlaceholder">
      <p class="secondary help" data-i18n="recordScope"></p>
      <p class="secondary help" data-i18n="defaultExpiry">记录默认有效期为 10 分钟，请在有效期内完成流程。</p>
      <p id="create-permission" class="permission-note"></p>
      <div class="dialog-actions"><button class="btn btn-outline-secondary" type="button" data-close-dialog="create-dialog" data-i18n="close">关闭</button><button class="btn btn-primary" type="submit" disabled data-i18n="createRecord">创建纳管记录</button></div>
    </form>
  </dialog>
  <dialog id="detail-dialog" class="detail-dialog" aria-labelledby="detail-heading">
    <div class="sheet-heading"><button id="detail-back" type="button" class="btn icon-button" hidden data-i18n-aria="back"><span data-icon="left"></span></button><h2 id="detail-heading"></h2><button type="button" class="btn icon-button" data-close-dialog="detail-dialog" data-i18n-aria="close"><span data-icon="close"></span></button></div>
    <div class="sheet-feedback"><div id="detail-feedback" class="feedback" role="status" aria-live="polite" aria-atomic="true" hidden></div><div id="detail-recovery" class="dialog-recovery" hidden><button type="button" class="btn btn-outline-secondary" data-refresh-state data-i18n="readServerState">读取服务端状态</button></div></div>
    <div id="detail-content"></div>
  </dialog>
  <script type="module" src="./app.js"></script>
</body>
</html>

name: approved-admin-disposable

on:
  pull_request:
    paths:
      - '.github/workflows/admin-command-disposable.yml'
      - 'scripts/check-approved-admin-disposable.py'
      - 'packages/runtime-python/**'
      - 'packages/typed-control/src/approvedAdminCommand.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: approved-admin-disposable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  disposable-systemd:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare an isolated root-owned interpreter
        run: |
          test ! -e /run/ghostfleet-admin-ci-venv
          sudo /usr/bin/python3 -m venv /run/ghostfleet-admin-ci-venv
          sudo chmod 0700 /run/ghostfleet-admin-ci-venv
          sudo /run/ghostfleet-admin-ci-venv/bin/python -I -m pip install --disable-pip-version-check cryptography==50.0.2
      - name: Inspect the fixed interpreter trust chain
        run: sudo stat -Lc '%u:%g %a %n' / /run /run/ghostfleet-admin-ci-venv /run/ghostfleet-admin-ci-venv/bin /run/ghostfleet-admin-ci-venv/bin/python /usr /usr/bin /usr/bin/python3 /usr/bin/systemctl /usr/bin/systemd-run
      - name: Verify actual root effect and cgroup lifecycle
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT /run/ghostfleet-admin-ci-venv/bin/python -I scripts/check-approved-admin-disposable.py
      - name: Remove the disposable interpreter
        if: always()
        run: sudo rm -rf -- /run/ghostfleet-admin-ci-venv

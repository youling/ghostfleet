[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostfleet-node-agent"
version = "0.1.0.dev0"
description = "Resident non-root GhostFleet node agent: pull-based, read-only typed tasks, no privileged path"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
ghostfleet-node-agent = "ghostfleet_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
